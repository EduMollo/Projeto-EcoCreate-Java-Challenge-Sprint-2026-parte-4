<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titulo, conteudo)">
<head>
	<meta charset="UTF-8">
	<script th:src="@{/js/tema.js}"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:replace="${titulo}">ClyvoVet</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link th:href="@{/css/app.css(v=5)}" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
<a class="skip-link" href="#conteudo-principal">Ir para o conteúdo</a>

	<nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

	<main id="conteudo-principal" class="container py-4 flex-grow-1">
		<div th:replace="~{fragmentos/alertas :: alertas}"></div>
		<section th:replace="${conteudo}"></section>
	</main>

	<footer class="app-footer"><div class="container"><span class="footer-brand"><i class="bi bi-heart-pulse me-1" aria-hidden="true"></i>ClyvoVet</span><span>Cuidado que acompanha cada fase da vida.</span></div></footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/navegacao.js(v=5)}" defer></script>
</body>
</html>
