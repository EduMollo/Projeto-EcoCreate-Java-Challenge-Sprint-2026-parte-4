<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragmentos/layout :: layout(~{::title}, ~{::section})}">
<head><title>Relatórios - ClyvoVet</title></head><body><section>
<h1 class="h3">Relatórios</h1>
<p class="text-secondary">Consulte o faturamento e exporte os atendimentos registrados.</p>
<div th:unless="${relatoriosDisponiveis}" class="alert alert-info">Os relatórios estão indisponíveis neste ambiente.</div>
<div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
<div th:if="${relatoriosDisponiveis}" class="row g-3">
<div class="col-md-6"><div class="card card-body"><h2 class="h5">Atendimentos</h2>
<form th:action="@{/relatorios/atendimentos.json}" method="get">
<label for="clinica" class="form-label">Código da clínica (opcional)</label><input id="clinica" name="clinica" type="number" min="1" class="form-control mb-3">
<button class="btn btn-primary">Baixar JSON</button></form></div></div>
<div class="col-md-6"><div class="card card-body"><h2 class="h5">Faturamento anual</h2>
<form th:action="@{/relatorios/faturamento}" method="get"><label for="ano" class="form-label">Ano</label>
<input id="ano" name="ano" type="number" min="2000" max="2100" required th:value="${ano}" class="form-control mb-3"><button class="btn btn-primary">Consultar</button></form></div></div></div>
<pre th:if="${resultado}" th:text="${resultado}" class="relatorio card card-body mt-3"></pre>
</section></body></html>
