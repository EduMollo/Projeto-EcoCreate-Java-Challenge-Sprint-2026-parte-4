<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragmentos/layout :: layout(~{::title}, ~{::section})}">
<head>
	<title>Painel administrativo — ClyvoVet</title>
</head>
<body>
<section>
<div class="welcome-panel"><div><span class="eyebrow">Visão geral</span><h1>Olá, <span th:text="${usuarioLogado.nomeExibicao}">Administrador</span><span style="color:var(--clyvo-primary)">.</span></h1><p>Todos os cuidados, em um só lugar. Acompanhe sua rede e organize os próximos atendimentos.</p></div><div class="welcome-actions"><span class="date-chip"><i class="bi bi-calendar3" aria-hidden="true"></i><span th:text="${#temporals.format(#temporals.createToday(), 'dd/MM/yyyy')}">Hoje</span></span><a th:href="@{/consultas/nova}" class="btn btn-primary"><i class="bi bi-plus-lg me-2" aria-hidden="true"></i>Agendar consulta</a></div></div>

	<div class="row g-3 mb-4">
		<div class="col-6 col-lg-3">
			<div class="card card-indicador shadow-sm h-100"><span class="indicador-icon" aria-hidden="true"><i class="bi bi-heart"></i></span>
				<div class="card-body">
					<div class="text-secondary small">Pets ativos</div>
					<div class="valor" th:text="${totalPets}">0</div>
					<a th:href="@{/pets}" class="small">Ver pets</a>
				</div>
			</div>
		</div>
		<div class="col-6 col-lg-3">
			<div class="card card-indicador shadow-sm h-100"><span class="indicador-icon" aria-hidden="true"><i class="bi bi-people"></i></span>
				<div class="card-body">
					<div class="text-secondary small">Tutores</div>
					<div class="valor" th:text="${totalTutores}">0</div>
					<a th:href="@{/tutores}" class="small">Ver tutores</a>
				</div>
			</div>
		</div>
		<div class="col-6 col-lg-3">
			<div class="card card-indicador shadow-sm h-100"><span class="indicador-icon" aria-hidden="true"><i class="bi bi-hospital"></i></span>
				<div class="card-body">
					<div class="text-secondary small">Clínicas</div>
					<div class="valor" th:text="${totalClinicas}">0</div>
					<a th:href="@{/clinicas}" class="small">Ver clínicas</a>
				</div>
			</div>
		</div>
		<div class="col-6 col-lg-3">
			<div class="card card-indicador shadow-sm h-100"><span class="indicador-icon" aria-hidden="true"><i class="bi bi-person-gear"></i></span>
				<div class="card-body">
					<div class="text-secondary small">Usuários</div>
					<div class="valor" th:text="${totalUsuarios}">0</div>
					<a th:href="@{/usuarios}" class="small">Gerenciar usuários</a>
				</div>
			</div>
		</div>
	</div>

	<h2 class="panel-section-title">Acompanhamento do dia</h2>
<div th:replace="~{consulta/fragmentos :: agenda(${agendaDoDia}, ${naoRealizadas})}"></div>
</section>
</body>
</html>
