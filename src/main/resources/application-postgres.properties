# Supabase: Session pooler 5432 ou conexao direta; nao usar transaction pooler 6543.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=clyvovet
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.flyway.locations=classpath:db/postgres
spring.flyway.default-schema=clyvovet
spring.flyway.schemas=clyvovet
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false
spring.jpa.properties.hibernate.default_schema=clyvovet
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
